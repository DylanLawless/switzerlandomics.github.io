  <title
     id="fig-title">Causal attention mask</title>
  <desc
     id="fig-desc">A four by four causal attention mask for the supplied input sequence T, h, e and space. Rows are query positions and columns are key positions. The diagonal and lower triangle are available, while future positions above the diagonal are masked. The third row, corresponding to e, is highlighted as a worked example.</desc>
