  <title
     id="fig-title">From recurrence to causal self-attention</title>
  <desc
     id="fig-desc">Two-panel comparison using the input characters T, h, e and space. At left, a recurrent network receives each character and passes information from hidden state h1 through h4. At right, the representation at position four uses causal self-attention to combine information from all four supplied input positions; the next character to be predicted is not shown as an input.</desc>
