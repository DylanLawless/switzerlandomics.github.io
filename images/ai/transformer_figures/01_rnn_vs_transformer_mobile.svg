<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 790" width="430" height="790" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">From recurrence to causal self-attention, mobile layout</title>
  <desc id="fig-desc">Vertically stacked comparison of a recurrent network and causal self-attention. The recurrent network reads T, h, e and a space through successive hidden states h1 to h4. Attention at position four can combine information from all four supplied characters. The future target is not available.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#000000"/></marker>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#929292"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#E5262F"/></marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue"; font-size: 16px; fill: #000000; }
    .heading { font-size: 21.333px; font-weight: 700; }
    .label { text-anchor: middle; dominant-baseline: middle; }
    .neutral { fill: #F3F2F2; stroke: #D9D9D9; stroke-width: 1.5; }
    .attention { fill: #FDEBED; stroke: #E5262F; stroke-width: 2; }
    .black-arrow { stroke: #000000; stroke-width: 1.8; fill: none; marker-end: url(#arrow-black); }
    .grey-arrow { stroke: #929292; stroke-width: 2; fill: none; marker-end: url(#arrow-grey); }
    .red-arrow { stroke: #E5262F; stroke-width: 2.4; fill: none; marker-end: url(#arrow-red); }
  </style>
  <rect width="430" height="790" fill="#FFFFFF"/>
  <!-- Top: recurrence. -->
  <text class="heading" x="22" y="57">Recurrent network</text>
  <g class="neutral">
    <rect x="35" y="133" width="50" height="54" rx="5"/>
    <rect x="135" y="133" width="50" height="54" rx="5"/>
    <rect x="235" y="133" width="50" height="54" rx="5"/>
    <rect x="335" y="133" width="50" height="54" rx="5"/>
  </g>
  <g class="black-arrow">
    <path d="M87 160 H132"/><path d="M187 160 H232"/><path d="M287 160 H332"/>
    <path d="M60 227 V193"/><path d="M160 227 V193"/>
    <path d="M260 227 V193"/><path d="M360 227 V193"/>
  </g>
  <g class="label">
    <text x="60" y="160">h₁</text><text x="160" y="160">h₂</text>
    <text x="260" y="160">h₃</text><text x="360" y="160">h₄</text>
    <text x="60" y="261">T</text><text x="160" y="261">h</text>
    <text x="260" y="261">e</text><text x="360" y="261" style="font-size: 30px">␠</text>
  </g>
  <text x="22" y="329">Context passes through successive hidden states.</text>
  <!-- Bottom: causal attention. -->
  <text class="heading" x="22" y="424">Causal self-attention</text>
  <g class="neutral">
    <rect x="35" y="500" width="50" height="54" rx="5"/>
    <rect x="135" y="500" width="50" height="54" rx="5"/>
    <rect x="235" y="500" width="50" height="54" rx="5"/>
    <rect x="335" y="500" width="50" height="54" rx="5"/>
  </g>
  <g class="label">
    <text x="60" y="527">T</text><text x="160" y="527">h</text>
    <text x="260" y="527">e</text><text x="360" y="527" style="font-size: 30px">␠</text>
  </g>
  <g class="grey-arrow">
    <path d="M60 560 L115 626"/>
    <path d="M160 560 L177 626"/>
    <path d="M260 560 L252 626"/>
  </g>
  <path class="red-arrow" d="M360 560 L318 626"/>
  <rect class="attention" x="90" y="632" width="250" height="58" rx="6"/>
  <text class="label" x="215" y="661">Attention at position 4</text>
  <text x="22" y="744">Position 4 can combine positions 1–4 directly.</text>
</svg>
